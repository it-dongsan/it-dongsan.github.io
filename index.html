<style>

  iframe{border:0;width:100%;height:100%;display:block}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    background:#f2f4f7;z-index:9;transition:opacity .35s ease}
  #splash.hide{opacity:0;pointer-events:none}
  #splash img{width:min(46vw,190px);height:auto;animation:breathe 2.2s ease-in-out infinite}

  #splash .dots span:nth-child(2){animation-delay:.2s}
  #splash .dots span:nth-child(3){animation-delay:.4s}
  @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
  @media (prefers-reduced-motion:reduce){#splash img,#splash .dots span{animation:none}}
</style>
